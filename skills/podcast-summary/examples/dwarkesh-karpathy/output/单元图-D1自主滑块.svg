<text id="t1" x="60" y="88" font-family="Noto Sans SC" font-size="26" font-weight="700" fill="#2e4a2a" text-anchor="start">D1 客服的自主滑块：AI 处理大部分量，人退到监督位</text>
<rect id="r2" x="60" y="120" width="1184" height="96" rx="4" fill="#2e4a2a"/>
