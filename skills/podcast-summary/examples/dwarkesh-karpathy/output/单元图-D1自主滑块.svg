<text id="t4" x="80" y="192" font-family="Noto Sans SC" font-size="18" font-weight="400" fill="#efe7d4" text-anchor="start">80% 的量</text>
<rect id="r5" x="1244" y="120" width="296" height="96" rx="4" fill="#e89cb1"/>
<text id="t6" x="1264" y="160" font-family="Noto Sans SC" font-size="22" font-weight="700" fill="#243a21" text-anchor="start">转给人</text>
<text id="t7" x="1264" y="192" font-family="Noto Sans SC" font-size="18" font-weight="400" fill="#243a21" text-anchor="start">20%</text>
