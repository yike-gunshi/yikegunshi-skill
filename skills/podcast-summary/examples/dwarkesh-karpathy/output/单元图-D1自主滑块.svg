<text id="t9" x="84" y="315" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#2e4a2a" text-anchor="start">人的新位置</text>
<text id="t10" x="84" y="344" font-family="Noto Sans SC" font-size="18" font-weight="400" fill="#1a1a17" text-anchor="start">一个人监督 5 个 AI 组成的小组</text>
