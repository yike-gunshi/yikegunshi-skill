<main id="canvas-app" class="shell">
 <header><div><h1 id="page-title"></h1><p id="page-subtitle" class="subtitle"></p></div><span id="version" class="version" hidden></span></header>
 <nav class="tabs" role="tablist" aria-label="内容视图"><button id="tab-canvas" role="tab" aria-controls="view-canvas" aria-selected="true" tabindex="0" data-view="canvas">画布</button><button id="tab-document" role="tab" aria-controls="view-document" aria-selected="false" tabindex="-1" data-view="document">文档</button><button id="tab-faq" role="tab" aria-controls="view-faq" aria-selected="false" tabindex="-1" data-view="faq" hidden>FAQ</button></nav>
 <section id="view-canvas" class="view" role="tabpanel" aria-labelledby="tab-canvas">
  <div class="navline"><div class="module-nav"><label for="module-select">定位模块</label><select id="module-select"><option value="">选择模块</option></select></div><div class="view-options"><button id="dependencies" class="control" aria-pressed="false" aria-controls="world" hidden>显示全部依赖</button><div id="legend" class="legend"></div></div></div>
  <div id="viewport" class="viewport" aria-label="可缩放、平移的知识画布"><div id="world" class="world"><svg id="base-layer" aria-label="知识结构"></svg><svg id="motion-layer" class="motion-layer" aria-hidden="true"></svg></div></div>
  <div class="bottom"><span class="hint">滚轮缩放 · 拖动平移 · 悬停查看 · 点击固定</span><div class="controls"><button id="zoom-out" class="control" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" class="control" aria-label="放大">＋</button><button id="readable" class="control">100%</button><button id="fit" class="control">适配全图</button><button id="fullscreen" class="control">全屏</button><button id="motion" class="control" aria-pressed="false" hidden>暂停流动</button></div></div>
  <div id="motion-note" class="motion-note" hidden>主流程按序示意 · 条件与辅助关系静态 · 动效不代表真实执行</div>
 </section>
 <section id="view-document" class="view reading-view" role="tabpanel" aria-labelledby="tab-document" hidden><nav id="doc-nav" class="doc-nav" aria-label="文档目录"></nav><div id="doc-scroll" class="doc-scroll" tabindex="0"><article id="doc-body" class="doc-body"></article></div></section>
 <section id="view-faq" class="view" role="tabpanel" aria-labelledby="tab-faq" hidden><div class="faq-scroll"><article id="faq-body" class="doc-body"></article></div></section>
 <p id="display-status" class="status" role="status" hidden></p>
 <aside id="panel" class="panel" hidden role="dialog" aria-modal="false" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title"></h2><div class="actions"><button id="pin" aria-pressed="false">固定</button><button id="close" aria-label="关闭详情">关闭 ×</button></div></div><div id="panel-body" class="panel-body" tabindex="0"></div><div class="panel-foot">Esc 关闭 · 样例保留原始内容</div></aside>
 <noscript><div class="noscript">当前环境未运行 JavaScript，交互画布不可用</div></noscript>
</main>

              "raw": "    def configure_optimizers(self, weight_decay, learning_rate, betas, device_type):\n        # start with all of the candidate parameters\n        param_dict = {pn: p for pn, p in self.named_parameters()}\n        # filter out those that do not require grad\n        param_dict = {pn: p for pn, p in param_dict.items() if p.requires_grad}\n        # create optim groups. Any parameters that is 2D will be weight decayed, otherwise no.\n        # i.e. all weight tensors in matmuls + embeddings decay, all biases and layernorms don't.\n        decay_params = [p for n, p in param_dict.items() if p.dim() >= 2]\n        nodecay_params = [p for n, p in param_dict.items() if p.dim() \u003c 2]\n        optim_groups = [\n            {'params': decay_params, 'weight_decay': weight_decay},\n            {'params': nodecay_params, 'weight_decay': 0.0}\n        ]\n        num_decay_params = sum(p.numel() for p in decay_params)\n        num_nodecay_params = sum(p.numel() for p in nodecay_params)\n        print(f\"num decayed parameter tensors: {len(decay_params)}, with {num_decay_params:,} parameters\")\n        print(f\"num non-decayed parameter tensors: {len(nodecay_params)}, with {num_nodecay_params:,} parameters\")\n        # Create AdamW optimizer and use the fused version if it is available\n        fused_available = 'fused' in inspect.signature(torch.optim.AdamW).parameters\n        use_fused = fused_available and device_type == 'cuda'\n        extra_args = dict(fused=True) if use_fused else dict()\n        optimizer = torch.optim.AdamW(optim_groups, lr=learning_rate, betas=betas, **extra_args)\n        print(f\"using fused AdamW: {use_fused}\")\n\n        return optimizer"
            }

              "format": "code",
              "raw": "    @torch.no_grad()\n    def generate(self, idx, max_new_tokens, temperature=1.0, top_k=None):\n        \"\"\"\n        Take a conditioning sequence of indices idx (LongTensor of shape (b,t)) and complete\n        the sequence max_new_tokens times, feeding the predictions back into the model each time.\n        Most likely you'll want to make sure to be in model.eval() mode of operation for this.\n        \"\"\"\n        for _ in range(max_new_tokens):\n            # if the sequence context is growing too long we must crop it at block_size\n            idx_cond = idx if idx.size(1) \u003c= self.config.block_size else idx[:, -self.config.block_size:]\n            # forward the model to get the logits for the index in the sequence\n            logits, _ = self(idx_cond)\n            # pluck the logits at the final step and scale by desired temperature\n            logits = logits[:, -1, :] / temperature\n            # optionally crop the logits to only the top k options\n            if top_k is not None:\n                v, _ = torch.topk(logits, min(top_k, logits.size(-1)))\n                logits[logits \u003c v[:, [-1]]] = -float('Inf')"

            {
              "label": "model.py 52-76",
              "format": "code",
              "raw": "    def forward(self, x):\n        B, T, C = x.size() # batch size, sequence length, embedding dimensionality (n_embd)\n\n        # calculate query, key, values for all heads in batch and move head forward to be the batch dim\n        q, k, v  = self.c_attn(x).split(self.n_embd, dim=2)\n        k = k.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\n        q = q.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\n        v = v.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\n\n        # causal self-attention; Self-attend: (B, nh, T, hs) x (B, nh, hs, T) -> (B, nh, T, T)\n        if self.flash:\n            # efficient attention using Flash Attention CUDA kernels\n            y = torch.nn.functional.scaled_dot_product_attention(q, k, v, attn_mask=None, dropout_p=self.dropout if self.training else 0, is_causal=True)\n        else:\n            # manual implementation of attention\n            att = (q @ k.transpose(-2, -1)) * (1.0 / math.sqrt(k.size(-1)))\n            att = att.masked_fill(self.bias[:,:,:T,:T] == 0, float('-inf'))\n            att = F.softmax(att, dim=-1)\n            att = self.attn_dropout(att)\n            y = att @ v # (B, nh, T, T) x (B, nh, T, hs) -> (B, nh, T, hs)\n        y = y.transpose(1, 2).contiguous().view(B, T, C) # re-assemble all head outputs side by side\n\n        # output projection\n        y = self.resid_dropout(self.c_proj(y))\n        return y"
