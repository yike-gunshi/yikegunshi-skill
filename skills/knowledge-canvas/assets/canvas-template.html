<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="虚构资料交互画布，默认100%阅读比例，640像素高操作区，全屏时画布填满剩余空间，支持缩放、平移与悬停详情">
<title>知识画布 · 结构化理解</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}[hidden]{display:none!important}.shell{position:relative;background:#020617;display:flex;flex-direction:column;padding:18px;gap:12px}header{flex-shrink:0;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0 0 5px;font-weight:600}.subtitle{font-size:12px;color:#94a3b8;margin:0}.viewport{flex:none;height:640px;min-height:200px;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:#081020;background-image:radial-gradient(#263147 .8px,transparent .8px);background-size:24px 24px;border:1px solid #263147;border-radius:12px}.viewport.dragging{cursor:grabbing}.world{position:absolute;width:1100px;height:570px;transform-origin:0 0}.world svg{position:absolute;inset:0;width:1100px;height:570px;pointer-events:none}.group{position:absolute;border:1px dashed #42526f;border-radius:16px;pointer-events:none}.group h2{font-size:15px;color:#a5b4cf;margin:18px}.group.outer{left:25px;top:35px;width:1050px;height:500px}.group.inner{left:650px;top:100px;width:390px;height:400px;background:#a78bfa05;border-color:#655887}.node{position:absolute;width:210px;min-height:86px;padding:17px;text-align:left;border:1px solid var(--accent,#22d3ee);border-radius:11px;background:#101d30;color:#f1f5f9;box-shadow:0 8px 20px #0003}.node:hover,.node.active{background:#1e2942;box-shadow:0 0 0 2px #a78bfa30}.node strong{display:block;font-size:20px;font-weight:600;line-height:1.5}.node small{display:block;margin-top:5px;color:#a8b6ca;font-size:13px;line-height:1.5}.node.document{border-radius:3px 18px 3px 3px;--accent:#a78bfa;background:linear-gradient(135deg,#221c39,#151e30)}.node.database{border-radius:45% / 16%;--accent:#34d399;padding-top:22px;padding-bottom:22px}.node.unavailable{border-color:#566172;background:#162031;opacity:.62}.note{position:absolute;left:70px;top:350px;width:480px;color:#8a9ab4;font-size:14px;line-height:1.9}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls button,.panel button{border:1px solid #41516b;border-radius:5px;color:#dbeafe;background:#142036;padding:6px 10px;font-size:12px}.controls output{font-size:12px;min-width:46px;text-align:center}.bottom{flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:10px}.panel{position:absolute;z-index:20;width:455px;overflow:auto;border:1px solid #70618f;border-radius:12px;background:#101827;box-shadow:0 18px 70px #0009;cursor:default}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px;border-bottom:1px solid #334155}.panel-head h2{font-size:16px;margin:0}.panel-body{padding:16px}.panel h3{font-size:13px;color:#c4b5fd;margin:0 0 12px}.panel ul{font-size:13px;line-height:1.9;padding-left:19px;margin:0 0 19px}.panel li{margin-bottom:7px}.panel pre{font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;background:#080f1d;padding:12px;border:1px solid #263147;border-radius:7px;margin:0}.sample-label{font-size:11px;color:#94a3b8;margin:0 0 8px}.actions{display:flex;gap:6px}.noscript{padding:12px;color:#fbbf24}@media(max-width:540px){.shell{padding:10px;gap:9px}h1{font-size:16px}.bottom{align-items:flex-start;flex-direction:column}.subtitle{font-size:11px}}
.shell:fullscreen{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;overflow:hidden}.shell:fullscreen .viewport{flex:1 1 0;height:auto;min-height:0}.shell::backdrop{background:#020617}.module-nav{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;color:#94a3b8}.module-nav select{font:inherit;color:#e2e8f0;background:#142036;border:1px solid #41516b;border-radius:5px;padding:5px}.node.text{border-color:transparent;background:transparent;box-shadow:none}.node.decision{clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}.rules{font-size:13px;line-height:1.9;margin-bottom:19px}.rule{margin:0 0 10px}.rule ul{margin:5px 0 0}.sample-item+.sample-item{margin-top:20px;border-top:1px solid #334155;padding-top:16px}.sample-item h4{font-size:12px;margin:12px 0 7px;color:#cbd5e1}.sample-source{font-size:11px;line-height:1.7;color:#94a3b8;margin:10px 0 0;overflow-wrap:anywhere}.display-status{flex-shrink:0;margin:0;font-size:12px;line-height:1.6;color:#a8b6ca}.display-status[data-warning="true"]{color:#fbbf24}.controls button[data-unavailable="true"]{color:#94a3b8;border-style:dashed}
</style>
</head>
<body>
<main class="shell" id="canvas-app">
<header><div><h1>知识画布 · 结构化理解</h1><p class="subtitle">全部内容为虚构示例 · 不含业务资料与外部资源</p></div></header>
<nav class="module-nav" aria-label="定位模块"><label for="module-select">定位模块</label><select id="module-select"><option value="">选择模块</option></select></nav>
<div class="viewport" id="viewport" aria-label="可缩放与平移的示例画布">
<div class="world" id="world">
<div class="group outer" data-group="overview"><h2>示例资料整理</h2></div>
<div class="group inner" data-group="results"><h2>整理结果 · 包含关系</h2></div>
<svg aria-hidden="true" viewBox="0 0 1100 570"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7b8ca5"/></marker></defs><g fill="none" stroke="#7b8ca5" stroke-width="1.5" marker-end="url(#arrow)"><path d="M280 220 H365"/><path d="M580 220 H620 V205 H690"/><path d="M580 235 H610 V345 H690"/></g><g fill="#8a9ab4" font-size="12"><text x="305" y="204">读取</text><text x="606" y="175">归纳</text><text x="620" y="332">举例</text></g></svg>
<button class="node" data-node="source" style="left:70px;top:175px"><strong>读取示例材料</strong><small>取得正文与章节信息</small></button>
<button class="node" data-node="extract" style="left:370px;top:175px"><strong>提取关键单元</strong><small>识别概念与关联</small></button>
<button class="node document" data-node="summary" style="left:695px;top:165px;width:305px"><strong>概念摘要</strong><small>整理后的文本内容</small></button>
<button class="node database" data-node="examples" style="left:695px;top:300px;width:305px"><strong>样例资料</strong><small>结构化示例与对应关系</small></button>
<button class="node unavailable" data-node="audio" style="left:695px;top:423px;width:305px;min-height:54px;padding:9px 17px"><strong style="font-size:16px">音频资料</strong><small>本示例未提供</small></button>
<p class="note">箭头表示处理关系<br>容器表示归属，内部内容不强行串成执行顺序</p>
</div></div>
<div class="bottom"><div class="controls"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="readable">100% 阅读</button><button id="fit">适配全图</button><button id="fullscreen" aria-describedby="display-status">全屏</button></div></div>
<p class="display-status" id="display-status" role="status" hidden></p>
<noscript><div class="noscript">当前环境未运行 JavaScript，交互验证尚未通过</div></noscript>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="false" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title"></h2><div class="actions"><button id="pin" aria-pressed="false">固定</button><button id="close" aria-label="关闭详情">关闭</button></div></div><div class="panel-body"><h3>说明</h3><div id="explanation" class="rules"></div><h3>样例</h3><div id="samples"></div></div></aside>
</main>
<script>
(()=>{
const nodes={
  "source": {
    "title": "读取示例材料",
    "points": [
      [
        "用途",
        "取得本次整理的材料"
      ],
      [
        "输出",
        [
          "材料名称和章节",
          "正文原文"
        ]
      ]
    ],
    "samples": [
      {
        "type": "构造示例",
        "input": {
          "file": "示例手册.txt"
        },
        "output": {
          "title": "示例手册",
          "chapter": "第一章",
          "text": "先明确问题，再组织证据，最后形成说明"
        },
        "source": "虚构教学数据，仅用于演示交互；生成成品时替换为本次材料"
      }
    ]
  },
  "extract": {
    "title": "提取关键单元",
    "points": [
      [
        "用途",
        "提取可以独立解释的概念与关系"
      ],
      [
        "输入",
        "材料中的正文片段"
      ],
      [
        "输出",
        "三个关键单元及其关联"
      ]
    ],
    "samples": [
      {
        "type": "构造示例",
        "input": {
          "title": "示例手册",
          "chapter": "第一章",
          "text": "先明确问题，再组织证据，最后形成说明"
        },
        "output": {
          "units": [
            "明确问题",
            "组织证据",
            "形成说明"
          ],
          "relations": [
            {
              "from": "明确问题",
              "to": "组织证据",
              "type": "学习顺序"
            },
            {
              "from": "组织证据",
              "to": "形成说明",
              "type": "支撑"
            }
          ]
        },
        "source": "虚构教学数据，仅用于演示交互；生成成品时替换为本次材料"
      }
    ]
  },
  "summary": {
    "title": "概念摘要",
    "points": [
      [
        "用途",
        "解释关键概念"
      ],
      [
        "归属",
        "属于整理结果，与样例资料并列"
      ]
    ],
    "samples": [
      {
        "type": "构造示例",
        "input": {
          "units": [
            "明确问题",
            "组织证据",
            "形成说明"
          ],
          "relations": [
            {
              "from": "明确问题",
              "to": "组织证据",
              "type": "学习顺序"
            },
            {
              "from": "组织证据",
              "to": "形成说明",
              "type": "支撑"
            }
          ]
        },
        "output": {
          "concept": "组织证据",
          "summary": "为每个关键判断保留对应依据",
          "source": "虚构示例手册 · 第一章"
        },
        "source": "虚构教学数据，仅用于演示交互；生成成品时替换为本次材料"
      }
    ]
  },
  "examples": {
    "title": "样例资料",
    "points": [
      [
        "用途",
        "展示抽象概念对应的具体形态"
      ],
      [
        "结构",
        "保留 JSON 字段与层次"
      ]
    ],
    "samples": [
      {
        "type": "构造示例",
        "input": {
          "question": "如何验证提取结果"
        },
        "output": {
          "item_id": "demo-001",
          "claim": "示例材料包含三个关键单元",
          "evidence": {
            "chapter": "第一章",
            "units_count": 3
          }
        },
        "source": "虚构教学数据，仅用于演示交互；生成成品时替换为本次材料"
      }
    ]
  },
  "audio": {
    "title": "音频资料",
    "points": [
      [
        "状态",
        "本示例未提供音频资料"
      ],
      [
        "说明",
        "材料缺席不代表平台不支持这类资料"
      ]
    ],
    "samples": [
      {
        "type": "构造示例",
        "input": {
          "provided": false
        },
        "output": {
          "result": null,
          "reason": "本次输入仅含虚构文本"
        },
        "source": "虚构教学数据，仅用于演示交互；生成成品时替换为本次材料"
      }
    ]
  }
};
const app=document.getElementById('canvas-app'),viewport=document.getElementById('viewport'),world=document.getElementById('world'),panel=document.getElementById('panel'),pin=document.getElementById('pin');
const state=window.canvasState={ready:true,scale:1,x:0,y:0,active:null,pinned:false};
let openTimer,closeTimer,drag=null;
const cancelOpen=()=>clearTimeout(openTimer);
function refresh(){world.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;document.getElementById('zoom-value').textContent=Math.round(state.scale*100)+'%';}
function close(){cancelOpen();clearTimeout(closeTimer);panel.hidden=true;state.active=null;state.pinned=false;pin.textContent='固定';pin.setAttribute('aria-pressed','false');document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));}
function setPinned(value){state.pinned=value;pin.textContent=value?'取消固定':'固定';pin.setAttribute('aria-pressed',String(value));}
function place(anchor){
 const bounds=app.getBoundingClientRect(),r=anchor.getBoundingClientRect();
 const width=app.clientWidth,height=document.fullscreenElement===app?app.clientHeight:Math.min(app.clientHeight,innerHeight);
 panel.style.maxWidth=Math.max(0,width-20)+'px';panel.style.maxHeight=Math.max(0,height-20)+'px';
 const w=panel.offsetWidth,h=panel.offsetHeight;let x=r.right-bounds.left+12;
 if(x+w>width-10)x=r.left-bounds.left-w-12;if(x<10)x=Math.max(10,(width-w)/2);
 panel.style.left=x+'px';panel.style.top=Math.max(10,Math.min(r.top-bounds.top,height-h-10))+'px';
}
function show(el,mode){cancelOpen();clearTimeout(closeTimer);const id=el.dataset.node,n=nodes[id];state.active=id;document.getElementById('panel-title').textContent=n.title;const list=document.getElementById('explanation');list.replaceChildren();n.points.forEach(([label,body])=>{const li=document.createElement('div'),b=document.createElement('b');li.className='rule';b.textContent=label+'：';li.append(b);if(Array.isArray(body)){const sub=document.createElement('ul');body.forEach(text=>{const item=document.createElement('li');item.textContent=text;sub.append(item);});li.append(sub);}else li.append(document.createTextNode(body));list.append(li);});const samples=document.getElementById('samples');samples.replaceChildren();
 n.samples.forEach(sample=>{const article=document.createElement('section');article.className='sample-item';
 ['input','output'].forEach(key=>{const heading=document.createElement('h4'),pre=document.createElement('pre'),code=document.createElement('code');heading.textContent=key==='input'?'输入 JSON':'输出 JSON';code.dataset.io=key;code.textContent=typeof sample[key]==='string'?sample[key]:JSON.stringify(sample[key],null,2);pre.append(code);article.append(heading,pre);});
 const source=document.createElement('p');source.className='sample-source';source.textContent=sample.type+' · '+sample.source;article.append(source);samples.append(article);
 });panel.hidden=false;document.querySelectorAll('.node').forEach(e=>e.classList.toggle('active',e===el));if(mode==='click')setPinned(true);place(el);refresh();}
function scheduleClose(){cancelOpen();clearTimeout(closeTimer);closeTimer=setTimeout(()=>{if(!state.pinned&&!panel.matches(':hover')&&!panel.contains(document.activeElement))close();},320);}
document.querySelectorAll('.node').forEach(el=>{el.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||drag||state.pinned)return;cancelOpen();clearTimeout(closeTimer);openTimer=setTimeout(()=>show(el,'hover'),600);});el.addEventListener('pointerleave',scheduleClose);el.addEventListener('click',()=>show(el,'click'));el.addEventListener('focus',()=>{if(el.matches(':focus-visible'))show(el,'focus');});el.addEventListener('blur',scheduleClose);});
panel.addEventListener('pointerenter',()=>clearTimeout(closeTimer));panel.addEventListener('pointerleave',scheduleClose);pin.onclick=()=>{setPinned(!state.pinned);if(!state.pinned)scheduleClose();};document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
function zoom(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){cancelOpen();if(!state.pinned)close();const minimum=Math.min(.1,(viewport.clientWidth-24)/world.offsetWidth,(viewport.clientHeight-24)/world.offsetHeight),old=state.scale,next=Math.max(minimum,Math.min(2.5,old*factor));state.x=cx-(cx-state.x)*next/old;state.y=cy-(cy-state.y)*next/old;state.scale=next;refresh();}
function readable(){cancelOpen();close();state.scale=1;state.x=12;state.y=12;refresh();}
function fit(){cancelOpen();close();state.scale=Math.min(1,(viewport.clientWidth-24)/world.offsetWidth,(viewport.clientHeight-24)/world.offsetHeight);state.x=(viewport.clientWidth-world.offsetWidth*state.scale)/2;state.y=(viewport.clientHeight-world.offsetHeight*state.scale)/2;refresh();}
document.getElementById('zoom-in').onclick=()=>zoom(1.2);document.getElementById('zoom-out').onclick=()=>zoom(1/1.2);document.getElementById('fit').onclick=fit;document.getElementById('readable').onclick=readable;
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.002),e.clientX-r.left,e.clientY-r.top);},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;close();drag={px:e.clientX,py:e.clientY,x:state.x,y:state.y};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');});
viewport.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;state.x=drag.x+dx;state.y=drag.y+dy;refresh();});
function stopDrag(){drag=null;viewport.classList.remove('dragging');refresh();}viewport.addEventListener('pointerup',stopDrag);viewport.addEventListener('pointercancel',stopDrag);
const fullscreenButton=document.getElementById('fullscreen'),displayStatus=document.getElementById('display-status');
function fullscreenStatus(message){
 const active=Boolean(document.fullscreenElement),available=Boolean(document.fullscreenEnabled&&app.requestFullscreen);
 state.fullscreenAvailable=available;state.fullscreen=active;
 fullscreenButton.textContent=active?'退出全屏':available?'全屏':'全屏限制';
 fullscreenButton.dataset.unavailable=String(!active&&!available);
 displayStatus.dataset.warning=String(Boolean(message)||!available);
 displayStatus.textContent=message||(!available?'当前浏览器或嵌入容器未开放全屏，仍可在正文中缩放与平移':'');
 displayStatus.hidden=!displayStatus.textContent;
}
fullscreenButton.onclick=async()=>{
 if(!document.fullscreenElement&&!state.fullscreenAvailable){fullscreenStatus('当前浏览器或嵌入容器未开放全屏，HTML 无法自行扩大到文档之外，正文内仍可缩放与平移');return;}
 try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen();}
 catch{fullscreenStatus('全屏请求未获允许，请检查浏览器或嵌入容器限制，正文内仍可缩放与平移');}
};
document.addEventListener('fullscreenchange',()=>{close();fullscreenStatus();});
window.addEventListener('resize',()=>{if(state.active)place(document.querySelector('[data-node="'+state.active+'"]'));});
const moduleSelect=document.getElementById('module-select');
 document.querySelectorAll('[data-group]').forEach(group=>{const option=document.createElement('option');option.value=group.dataset.group;option.textContent=group.querySelector('h2').textContent;moduleSelect.append(option);});
 moduleSelect.onchange=()=>{const group=Array.from(document.querySelectorAll('[data-group]')).find(g=>g.dataset.group===moduleSelect.value);if(!group)return;close();state.scale=Math.min(1,(viewport.clientWidth-24)/group.offsetWidth,(viewport.clientHeight-24)/group.offsetHeight);state.x=(viewport.clientWidth-group.offsetWidth*state.scale)/2-group.offsetLeft*state.scale;state.y=(viewport.clientHeight-group.offsetHeight*state.scale)/2-group.offsetTop*state.scale;refresh();moduleSelect.value='';};
 readable();fullscreenStatus();
})();
</script>
</body>
</html>
